name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check environment
        run: python tools/check_environment.py

      - name: Validate import integration
        run: python tools/validate_import_integration.py

      - name: Run tests
        run: python -m pytest
