<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Full-stack hardware engineer global opportunity value-chain map</title>
  <desc id="desc">A visual value-chain opportunity map for a full-stack hardware engineer going global, showing validate-now, validate-soon, watch, and avoid opportunity zones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1c2b33" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37566b"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #17242d; }
      .subtitle { font-family: Arial, sans-serif; font-size: 22px; fill: #445b68; }
      .laneTitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #1d2d35; }
      .laneSub { font-family: Arial, sans-serif; font-size: 14px; fill: #5d727c; }
      .cardTitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #14242b; }
      .cardText { font-family: Arial, sans-serif; font-size: 13px; fill: #364e59; }
      .tagText { font-family: Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #102027; }
      .legend { font-family: Arial, sans-serif; font-size: 14px; fill: #2d424c; }
      .axis { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #37566b; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #60737c; }
      .lane { fill: #ffffff; stroke: #d8e3e8; stroke-width: 1.5; filter: url(#shadow); }
      .now { fill: #dff8e8; stroke: #28a25b; stroke-width: 2; }
      .soon { fill: #fff1cd; stroke: #c58a12; stroke-width: 2; }
      .watch { fill: #e7efff; stroke: #5c79d6; stroke-width: 2; }
      .avoid { fill: #ffe2df; stroke: #c94134; stroke-width: 2; }
      .core { fill: #17242d; }
      .coreText { font-family: Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>

  <text x="70" y="78" class="title">Hardware Engineer Global Opportunity Map</text>
  <text x="72" y="116" class="subtitle">Map first, then choose the validation path. Green is not the whole market; it is the fastest payment zone.</text>

  <g transform="translate(1170 44)">
    <rect x="0" y="0" width="560" height="92" rx="16" fill="#ffffff" stroke="#d8e3e8"/>
    <rect x="22" y="24" width="24" height="24" rx="6" class="now"/>
    <text x="56" y="42" class="legend">Validate now</text>
    <rect x="178" y="24" width="24" height="24" rx="6" class="soon"/>
    <text x="212" y="42" class="legend">Validate soon</text>
    <rect x="344" y="24" width="24" height="24" rx="6" class="watch"/>
    <text x="378" y="42" class="legend">Watch / bundle</text>
    <rect x="22" y="58" width="24" height="24" rx="6" class="avoid"/>
    <text x="56" y="76" class="legend">Avoid as first move</text>
    <text x="344" y="76" class="legend">Score: speed to payment x risk</text>
  </g>

  <g transform="translate(70 165)">
    <rect x="0" y="0" width="1660" height="66" rx="16" fill="#ffffff" stroke="#d8e3e8"/>
    <text x="28" y="41" class="axis">Prototype</text>
    <line x1="142" y1="34" x2="380" y2="34" stroke="#37566b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="402" y="41" class="axis">Production Readiness</text>
    <line x1="620" y1="34" x2="820" y2="34" stroke="#37566b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="842" y="41" class="axis">Factory / Field</text>
    <line x1="980" y1="34" x2="1180" y2="34" stroke="#37566b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1202" y="41" class="axis">After-sales / Renewal</text>
    <line x1="1428" y1="34" x2="1600" y2="34" stroke="#37566b" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(70 270)">
    <rect class="lane" x="0" y="0" width="190" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">A. Hardware</text>
    <text x="20" y="62" class="laneSub">inventory, certification, warranty</text>
    <rect x="20" y="92" width="150" height="70" rx="14" class="avoid"/>
    <text x="34" y="121" class="cardTitle">Self-owned</text>
    <text x="34" y="144" class="cardText">AI / IoT device</text>
    <rect x="20" y="180" width="150" height="70" rx="14" class="avoid"/>
    <text x="34" y="209" class="cardTitle">White-label</text>
    <text x="34" y="232" class="cardText">hardware export</text>
    <rect x="20" y="268" width="150" height="70" rx="14" class="watch"/>
    <text x="34" y="297" class="cardTitle">Retrofit kit</text>
    <text x="34" y="320" class="cardText">narrow vertical</text>
    <rect x="20" y="356" width="150" height="70" rx="14" class="watch"/>
    <text x="34" y="385" class="cardTitle">Demo bundle</text>
    <text x="34" y="408" class="cardText">existing device</text>
  </g>

  <g transform="translate(270 270)">
    <rect class="lane" x="0" y="0" width="220" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">B. Design to Prod</text>
    <text x="20" y="62" class="laneSub">fastest remote payment zone</text>
    <rect x="20" y="92" width="180" height="78" rx="14" class="now"/>
    <text x="34" y="122" class="cardTitle">Readiness Review</text>
    <text x="34" y="146" class="cardText">main validation path</text>
    <rect x="20" y="188" width="180" height="78" rx="14" class="now"/>
    <text x="34" y="218" class="cardTitle">PCB / BOM Review</text>
    <text x="34" y="242" class="cardText">48h risk report</text>
    <rect x="20" y="284" width="180" height="78" rx="14" class="now"/>
    <text x="34" y="314" class="cardTitle">DFM / DFT Pack</text>
    <text x="34" y="338" class="cardText">test + factory handoff</text>
    <rect x="20" y="380" width="180" height="78" rx="14" class="now"/>
    <text x="34" y="410" class="cardTitle">Provisioning Audit</text>
    <text x="34" y="434" class="cardText">device identity / keys</text>
    <rect x="20" y="476" width="180" height="78" rx="14" class="now"/>
    <text x="34" y="506" class="cardTitle">Certification Prep</text>
    <text x="34" y="530" class="cardText">not final sign-off</text>
  </g>

  <g transform="translate(505 270)">
    <rect class="lane" x="0" y="0" width="210" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">C. Supply Chain</text>
    <text x="20" y="62" class="laneSub">BOM, suppliers, alternates</text>
    <rect x="20" y="92" width="170" height="78" rx="14" class="now"/>
    <text x="34" y="122" class="cardTitle">BOM Risk Report</text>
    <text x="34" y="146" class="cardText">lead time + EOL</text>
    <rect x="20" y="188" width="170" height="78" rx="14" class="now"/>
    <text x="34" y="218" class="cardTitle">Alternate Parts</text>
    <text x="34" y="242" class="cardText">second-source path</text>
    <rect x="20" y="284" width="170" height="78" rx="14" class="now"/>
    <text x="34" y="314" class="cardTitle">Supplier Handoff</text>
    <text x="34" y="338" class="cardText">English CM pack</text>
    <rect x="20" y="380" width="170" height="78" rx="14" class="watch"/>
    <text x="34" y="410" class="cardTitle">Part DB</text>
    <text x="34" y="434" class="cardText">replacement lookup</text>
    <rect x="20" y="476" width="170" height="78" rx="14" class="watch"/>
    <text x="34" y="506" class="cardTitle">Supplier QA</text>
    <text x="34" y="530" class="cardText">sample inspection</text>
  </g>

  <g transform="translate(730 270)">
    <rect class="lane" x="0" y="0" width="205" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">D. Integration</text>
    <text x="20" y="62" class="laneSub">site, PLC, deployment</text>
    <rect x="20" y="92" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="122" class="cardTitle">Site Survey</text>
    <text x="34" y="146" class="cardText">acceptance pack</text>
    <rect x="20" y="188" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="218" class="cardTitle">PLC Support</text>
    <text x="34" y="242" class="cardText">buyer unclear first</text>
    <rect x="20" y="284" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="314" class="cardTitle">Training Kit</text>
    <text x="34" y="338" class="cardText">deployment docs</text>
    <rect x="20" y="380" width="165" height="78" rx="14" class="soon"/>
    <text x="34" y="410" class="cardTitle">Acceptance Test</text>
    <text x="34" y="434" class="cardText">factory/site signoff</text>
  </g>

  <g transform="translate(950 270)">
    <rect class="lane" x="0" y="0" width="205" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">E. Factory Data</text>
    <text x="20" y="62" class="laneSub">traceability before AI vision</text>
    <rect x="20" y="92" width="165" height="78" rx="14" class="soon"/>
    <text x="34" y="122" class="cardTitle">QA Traceability</text>
    <text x="34" y="146" class="cardText">report from video</text>
    <rect x="20" y="188" width="165" height="78" rx="14" class="soon"/>
    <text x="34" y="218" class="cardTitle">Video Timeline</text>
    <text x="34" y="242" class="cardText">audit-ready record</text>
    <rect x="20" y="284" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="314" class="cardTitle">Shift Handover</text>
    <text x="34" y="338" class="cardText">work instruction logs</text>
    <rect x="20" y="380" width="165" height="78" rx="14" class="avoid"/>
    <text x="34" y="410" class="cardTitle">CV Quality Pilot</text>
    <text x="34" y="434" class="cardText">effect risk too high</text>
  </g>

  <g transform="translate(1170 270)">
    <rect class="lane" x="0" y="0" width="205" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">F. After-sales</text>
    <text x="20" y="62" class="laneSub">repair, parts, warranty</text>
    <rect x="20" y="92" width="165" height="78" rx="14" class="soon"/>
    <text x="34" y="122" class="cardTitle">Service Quote</text>
    <text x="34" y="146" class="cardText">notes to quote</text>
    <rect x="20" y="188" width="165" height="78" rx="14" class="soon"/>
    <text x="34" y="218" class="cardTitle">Parts KB</text>
    <text x="34" y="242" class="cardText">model + fault lookup</text>
    <rect x="20" y="284" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="314" class="cardTitle">Warranty Pack</text>
    <text x="34" y="338" class="cardText">claim evidence docs</text>
    <rect x="20" y="380" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="410" class="cardTitle">Damage Estimate</text>
    <text x="34" y="434" class="cardText">human-in-loop</text>
  </g>

  <g transform="translate(1390 270)">
    <rect class="lane" x="0" y="0" width="205" height="770" rx="22"/>
    <text x="20" y="38" class="laneTitle">G. Rental/Ops</text>
    <text x="20" y="62" class="laneSub">maintenance renewal loops</text>
    <rect x="20" y="92" width="165" height="78" rx="14" class="soon"/>
    <text x="34" y="122" class="cardTitle">Robot Rental OS</text>
    <text x="34" y="146" class="cardText">maintenance + booking</text>
    <rect x="20" y="188" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="218" class="cardTitle">Utilization Report</text>
    <text x="34" y="242" class="cardText">monthly ROI</text>
    <rect x="20" y="284" width="165" height="78" rx="14" class="watch"/>
    <text x="34" y="314" class="cardTitle">Operator Handoff</text>
    <text x="34" y="338" class="cardText">shift continuity</text>
  </g>

  <g transform="translate(1605 270)">
    <rect class="lane" x="0" y="0" width="125" height="770" rx="22"/>
    <text x="16" y="38" class="laneTitle">H. Sales</text>
    <text x="16" y="62" class="laneSub">export assets</text>
    <rect x="16" y="92" width="93" height="78" rx="14" class="now"/>
    <text x="26" y="122" class="cardTitle">Datasheet</text>
    <text x="26" y="146" class="cardText">EN pack</text>
    <rect x="16" y="188" width="93" height="78" rx="14" class="soon"/>
    <text x="26" y="218" class="cardTitle">FAQ</text>
    <text x="26" y="242" class="cardText">support</text>
    <rect x="16" y="284" width="93" height="78" rx="14" class="watch"/>
    <text x="26" y="314" class="cardTitle">SOP</text>
    <text x="26" y="338" class="cardText">samples</text>
  </g>

  <g>
    <path d="M 360 438 C 520 420, 580 418, 640 438" fill="none" stroke="#28a25b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M 640 438 C 845 430, 915 378, 1035 380" fill="none" stroke="#c58a12" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <path d="M 1035 380 C 1140 370, 1175 374, 1250 398" fill="none" stroke="#c58a12" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <rect x="310" y="1062" width="920" height="58" rx="18" fill="#ffffff" stroke="#d8e3e8"/>
    <text x="334" y="1098" class="small">Primary path: Readiness Review -> BOM/Supplier Pack. Optional pivots: QA Traceability, Field Service Quote, Robot Rental Maintenance.</text>
  </g>
</svg>
