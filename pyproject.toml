[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-engine"
version = "0.1.0"
description = "Opportunity Discovery Engine command-line toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
]

[project.scripts]
ode = "ode.cli:main"

[tool.setuptools.packages.find]
include = ["ode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
