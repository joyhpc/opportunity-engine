schema_version: "1.0.0"
sources:
  - id: hackernews_topstories
    label: Hacker News Top Stories
    status: active
    layer: trend_signal
    adapter: ode.tools.sources.hackernews.scan
    contexts:
      - scan_worker
      - explore
      - pain_listener
    endpoint: "https://hacker-news.firebaseio.com/v0/topstories.json"
    auth: none
    default_enabled: false
    freshness: near-real-time top stories
    requires:
      - hn_top > 0
    params:
      - hn_top
    strength_method: "story score: strong > 200, medium > 50, otherwise weak"
    best_for:
      - developer tools
      - infrastructure
      - AI engineering
      - technical early-adopter demand
    limitations:
      - Strong technical bias.
      - Not representative of mainstream consumer demand.

  - id: reddit_hot_rss
    label: Reddit Hot RSS
    status: active
    layer: community_signal
    adapter: ode.tools.sources.reddit.scan
    contexts:
      - scan_worker
      - explore
      - pain_listener
    endpoint: "https://www.reddit.com/r/{subreddit}/hot/.rss"
    auth: none
    default_enabled: false
    freshness: subreddit hot feed
    requires:
      - subreddits
    params:
      - reddit
    strength_method: "feed position estimate: top 3 strong, top 7 medium, otherwise weak"
    best_for:
      - pain mining
      - community complaints
      - user language
      - early validation topics
    limitations:
      - RSS does not include exact vote/comment metrics.
      - Needs carefully selected subreddits.
      - Can be noisy or meme-driven.

  - id: producthunt_feed
    label: Product Hunt Public Feed
    status: active
    layer: launch_signal
    adapter: ode.tools.sources.producthunt.scan
    contexts:
      - pain_listener
    endpoint: "https://www.producthunt.com/feed"
    auth: none
    default_enabled: false
    freshness: recent Product Hunt feed items
    requires:
      - pain listener or explicit scanner call
    params:
      - product_hunt_limit
    strength_method: "feed position estimate: top 5 strong, top 15 medium, otherwise weak"
    best_for:
      - startup launches
      - indie AI tools
      - solution-side proxies for pain mapping
      - competitor language
    limitations:
      - Launch attention is not revenue evidence.
      - Public feed does not expose full vote/comment/topic metadata.
      - Pain listener caps this as solution-side evidence until corroborated by user/community pain.
      - Use GraphQL API later when token-backed launch metrics are needed.

  - id: google_trends
    label: Google Trends
    status: optional
    layer: search_interest
    adapter: ode.tools.sources.google_trends.scan
    contexts:
      - scan_worker
      - explore
    endpoint: pytrends unofficial Google Trends client
    auth: none
    default_enabled: true
    freshness: requested timeframe, default today 3-m
    requires:
      - keywords
      - optional dependency pytrends
    params:
      - keywords
      - timeframe
      - geo
    strength_method: recent interest versus earlier interest momentum
    best_for:
      - broad demand shifts
      - timing validation
      - keyword expansion
    limitations:
      - pytrends is unofficial and may break.
      - Requires seed keywords, so it is not fully open discovery.
      - Low-volume niche terms can be sparse.

  - id: duckduckgo_instant_answer
    label: DuckDuckGo Instant Answer
    status: utility
    layer: evidence_search
    adapter: ode.tools.data_fetcher.fetch_web
    endpoint: "https://api.duckduckgo.com/"
    auth: none
    default_enabled: false
    freshness: query dependent
    requires:
      - query
    params:
      - query
      - max_results
    strength_method: not used for trend strength
    best_for:
      - future evidence gathering
      - lightweight source discovery
    limitations:
      - Not called by scan workers today.
      - Instant Answer API often returns sparse results.

  - id: manual_signal
    label: Manual Signal
    status: manual
    layer: human_curated_signal
    adapter: ode.core.models.Signal
    endpoint: local YAML store
    auth: none
    default_enabled: false
    freshness: user supplied
    requires:
      - title
      - source
    params:
      - title
      - url
      - strength
      - keyword
    strength_method: user supplied
    best_for:
      - interview notes
      - paid commitments
      - curated news and funding signals
    limitations:
      - Depends on human judgment.
      - Needs source URL and notes to stay auditable.

  - id: arxiv_recent
    label: arXiv Recent Papers
    status: planned
    layer: research_signal
    adapter: planned
    endpoint: "https://export.arxiv.org/api/query"
    auth: none
    default_enabled: false
    freshness: recent submissions
    requires:
      - query
    params:
      - query
      - max_results
    strength_method: planned
    best_for:
      - AI research inflection points
      - early technical feasibility shifts
    limitations:
      - Research activity is not direct willingness to pay.

  - id: github_trending
    label: GitHub Trending / Repository Momentum
    status: planned
    layer: builder_signal
    adapter: planned
    endpoint: GitHub search or trending source
    auth: optional
    default_enabled: false
    freshness: daily to weekly
    requires:
      - topic
    params:
      - topic
      - language
    strength_method: planned
    best_for:
      - developer adoption
      - open-source momentum
      - infrastructure opportunities
    limitations:
      - Stars can be vanity metrics.
      - GitHub API limits may apply.

  - id: funding_news
    label: Funding and Launch News
    status: planned
    layer: market_signal
    adapter: planned
    endpoint: curated news feeds
    auth: optional
    default_enabled: false
    freshness: daily to weekly
    requires:
      - query
    params:
      - query
      - lookback_days
    strength_method: planned
    best_for:
      - capital flow
      - competitor emergence
      - category timing
    limitations:
      - Funding is not product-market fit.
      - News coverage can lag real market changes.

  - id: youtube_data_api_search
    label: YouTube Data API Search
    status: planned
    region: global
    language:
      - multi
    access_method: official_api_key
    layer: content_search_signal
    adapter: planned
    endpoint: "https://developers.google.com/youtube/v3/docs/search/list"
    auth: api_key_or_oauth
    default_enabled: false
    freshness: near-real-time subject to quota
    requires:
      - Google Cloud project
      - YouTube Data API quota
      - approved API adapter
    params:
      - query
      - published_after
      - region_code
      - order
    strength_method: "video search presence plus public engagement fetched through follow-up video statistics"
    best_for:
      - video demand discovery
      - creator economy
      - tutorials and education
      - consumer interest validation
    limitations:
      - Search ranking is not a complete platform sample.
      - API quota can constrain broad scans.
      - Engagement does not prove revenue.

  - id: tiktok_research_api
    label: TikTok Research API
    status: planned
    region: global
    language:
      - multi
    access_method: official_api_research_approval
    layer: short_video_signal
    adapter: planned
    endpoint: "https://developers.tiktok.com/doc/research-api/"
    auth: approved_research_access
    default_enabled: false
    freshness: query dependent
    requires:
      - TikTok developer account
      - Research API approval
      - compliant research or analysis use case
    params:
      - query
      - region
      - created_after
      - created_before
    strength_method: "public video metadata under approved access; attention only, not revenue"
    best_for:
      - short-video trend discovery
      - creator and consumer language
      - international content-market comparison
    limitations:
      - Access is restricted and approval-based.
      - Coverage may be incomplete for commercial opportunity discovery.
      - Not suitable for scraping private or user-level data.

  - id: instagram_graph_hashtag_api
    label: Instagram Graph Hashtag API
    status: planned
    region: global
    language:
      - multi
    access_method: official_api_business_auth
    layer: social_content_signal
    adapter: planned
    endpoint: "https://developers.facebook.com/docs/instagram-platform/instagram-graph-api/reference/ig-hashtag"
    auth: instagram_business_or_creator_auth
    default_enabled: false
    freshness: query dependent
    requires:
      - Meta developer app
      - connected Instagram Business or Creator account
      - approved permissions
    params:
      - hashtag
      - top_or_recent
      - time_range
    strength_method: "hashtag media presence and public engagement fields where available"
    best_for:
      - visual commerce
      - consumer trends
      - creator content themes
    limitations:
      - Requires business/creator account setup and permissions.
      - Hashtag search is not general full-text search.
      - Platform ranking and available fields can change.

  - id: meta_ads_library_api
    label: Meta Ads Library API
    status: planned
    region: global
    language:
      - multi
    access_method: official_api
    layer: paid_demand_signal
    adapter: planned
    endpoint: "https://www.facebook.com/ads/library/api"
    auth: developer_token
    default_enabled: false
    freshness: daily
    requires:
      - Meta developer access
      - approved API adapter
    params:
      - query
      - ad_reached_countries
      - ad_active_status
    strength_method: "advertiser persistence and creative volume; spend is often incomplete or estimated"
    best_for:
      - paid acquisition proof
      - competitor messaging
      - category monetization clues
    limitations:
      - Ad presence suggests budget, not profit.
      - Commercial ad fields may be limited by jurisdiction and policy.
      - Must avoid treating estimated spend as verified revenue.

